# ArgoCD Application — fd-source-probe（cheap 集群 fd-prod）。
# 形制照 fd-zhengxin-reference 配方：Application 放在同步路径（deploy/k8s）之外
# 避免自引用；GitOps 只管工作负载清单；Secret 不入 git（本服务无 Secret）。
#
# 上牌前置（一次性，集群内手工）：
#   1. gitee 建仓 FindDataTechnology/fd-source-probe 并首推（本仓当前未 git init）
#   2. 出镜像推 ccr.ccs.tencentyun.com/finddata-business/fd-source-probe:main
#   3. argocd ns 建 repo 凭据 secret（repo-fd-source-probe）
#   4. apply 本 Application（automated+selfHeal）
#   5. 注册处条目（path=/fd-source-probe，auth_scheme=none，NodePort 31904，
#      tool-surface.json 随仓；surface 名单表 commercial_tools=0 / internal=1）
# 上牌后回填 fleet-packs/README §packId 台账并重跑 cast（占位自引用解析）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fd-source-probe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitee.com/FindDataTechnology/fd-source-probe.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fd-prod
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
