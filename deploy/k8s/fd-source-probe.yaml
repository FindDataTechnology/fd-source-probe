# fd-source-probe — prod (fd-prod)
# 源侦察探针 MCP（FastMCP streamable-http /mcp on :8000），internal-only。
# 形制照 fd-zhengxin-reference 配方；差异点：
#   * 无凭据 Secret（探针零凭据设计；代理通路走集群内 forwarder 环境变量，非密钥）
#   * 审计落 emptyDir（/var/log/fd-source-probe/audit.jsonl），证据可随取证流程拷出
#   * FD_PROBE_PROXY_FORWARDER 指向既有 proxy-service forwarder（proxy-ignorant 纪律：
#     探针不实现选择/熔断，出口策略全在 proxy-service）
#   * internal-only：不建 Ingress；仅 mesh NodePort 可达（cheap6.mesh.finddata.cn:31911）
# 资源档：纯转发型轻负载，requests 20m/64Mi；limits 给足余量防探针并发峰值。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-source-probe
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-source-probe
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
    app.kubernetes.io/visibility: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-source-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-source-probe
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
        app.kubernetes.io/visibility: internal
    spec:
      containers:
        - name: mcp
          image: ccr.ccs.tencentyun.com/finddata-business/fd-source-probe:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
          env:
            - name: FD_PROBE_AUDIT_LOG
              value: /var/log/fd-source-probe/audit.jsonl
            - name: FD_PROBE_PROXY_FORWARDER
              value: http://proxy-fw.scraw:8080
            - name: FD_PROBE_PROXY_SOURCE
              value: source-probe
          volumeMounts:
            - name: audit
              mountPath: /var/log/fd-source-probe
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: audit
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: fd-source-probe
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-source-probe
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-source-probe
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31911
