# Container image publish — GitHub Actions -> Tencent TCR.
# 标准通道（照 fd-zhengxin-reference 配方）：测试门先行 → hkccr 出片 → 内容闸门铸 sha tag。
#
# 本仓当前为本地仓（无 remote）：仓建好后首次 push 即触发。
# 前置：仓上配 TCR_USERNAME / TCR_PASSWORD 两个 secret（集群内手工，不入 git）。
#
# 探针是安全敏感件（能产生任意出网流量），所以测试门不是形式：52 条离线用例里
# SSRF 拒绝集、逐跳复判、写方法零出网、代理不降级四组是发布前的硬门。
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

# 本仓既可能在自己的专属仓跑，也可能被 fd-build-snapshot 推进共享出片池
# （testaction00x/build-pool）——那里每个项目轮流占位，别人一 push 就会 cancel 我们的构建：
# 被 cancel 的镜像构建会留下半写 tag（平台文档明确：cancel-in-progress 对出片仓是错的）。
# 故改为**排队不取消**。同 ref 串行，不同 ref 并行。
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business
  IMAGE_NAME: fd-source-probe
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 放在装依赖之前：闸门是纯静态的，错了应该在 10 秒内红，别等 pip 装完。
      # 拦的是「$VAR 后紧跟全角字符被 bash 吞进变量名」这类只会在上线时才炸的写法
      # （实测两次：$NODEPORT（全集群）、$BUILD_HOST）），set -u 下直接 unbound variable。
      - name: Shell lint（语法 + 花括号闸）
        run: bash deploy/lint-shell.sh

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite（含 SSRF/逐跳/写方法零出网三道硬门）
        run: python -m pytest tests/ -q

  fd-source-probe:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-source-probe
      namespace: finddata-business
